name: Release

# 打 v* tag 就构建 PrWaiter.app、打成 DMG、发到 GitHub Releases。
#
# 签名是渐进的：
#   没配 secret        -> ad-hoc 签名（能跑，Gatekeeper 首次打开会警告）
#   MACOS_CERT_P12     -> 用该身份签名（自签或 Developer ID）
#   APPLE_ID + ...     -> 额外公证并装订，这才能去掉 Gatekeeper 警告
# 具体 secret 名字见 README 的「下载与安装」。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "要构建的版本号（如 0.6.0），留空则取 tag 名"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Check VERSION file matches the tag
        run: |
          FILE_VERSION="$(cat VERSION)"
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "VERSION 文件是 $FILE_VERSION，tag 是 $TAG_VERSION，对不上" >&2
            exit 1
          fi

      - name: Run tests
        run: ./test.sh

      - name: Import signing certificate (optional)
        id: signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "没有 MACOS_CERT_P12，走 ad-hoc 签名。"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          # 必须把新钥匙串加进搜索列表：codesign 是按搜索列表找身份的，
          # 只传 --keychain 会报 "no identity found"
          EXISTING="$(security list-keychains -d user | sed -e 's/[",]//g' -e 's/^[[:space:]]*//')"
          security list-keychains -d user -s "$KEYCHAIN" ${EXISTING}
          # 不加 -v：自签证书不是「受信任」身份，但 codesign 照样能用它签
          LINE="$(security find-identity -p codesigning "$KEYCHAIN" | grep -E '^[[:space:]]*[0-9]+\)' | head -1)"
          IDENTITY="$(echo "$LINE" | grep -oE '[0-9A-F]{40}' | head -1)"
          IDENTITY_NAME="$(echo "$LINE" | sed -E 's/^[^"]*"([^"]*)".*/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "导入的钥匙串里找不到代码签名身份：" >&2
            security find-identity -p codesigning "$KEYCHAIN" >&2
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "identity_name=$IDENTITY_NAME" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
          echo "Imported signing identity: $IDENTITY_NAME ($IDENTITY)"

      - name: Build and package .app
        env:
          CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          CODESIGN_IDENTITY_NAME: ${{ steps.signing.outputs.identity_name }}
          CODESIGN_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_ENV_PATH: /dev/null
        run: |
          chmod +x scripts/*.sh
          scripts/package_app.sh

      - name: Notarize and staple (optional)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "没配公证凭据，跳过公证。"
            exit 0
          fi
          ditto -c -k --keepParent dist/PrWaiter.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple dist/PrWaiter.app

      - name: Create DMG
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: scripts/make_dmg.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrWaiter-${{ steps.version.outputs.version }}-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES_FILE="release_notes/v${VERSION}.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "PrWaiter ${VERSION}" \
            "${NOTES_ARGS[@]}"
